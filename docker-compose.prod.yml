services:
  nginx:
    image: nginx:alpine
    container_name: agentops_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infra/nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - web
    networks:
      - agentops_prod
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: agentops_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentops_prod
    restart: always

  redis:
    image: redis:7-alpine
    container_name: agentops_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentops_prod
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentops_qdrant
    volumes:
      - qdrant_prod_data:/qdrant/storage
    networks:
      - agentops_prod
    restart: always

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agentops_api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentops_prod
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: agentops_web
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    networks:
      - agentops_prod
    restart: always

  celery_worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agentops_celery
    command: celery -A app.celery_app worker --loglevel=info --concurrency=8
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
    depends_on:
      - redis
      - postgres
    networks:
      - agentops_prod
    restart: always

  celery_beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agentops_celery_beat
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
    depends_on:
      - redis
    networks:
      - agentops_prod
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: agentops_prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_prod_data:/prometheus
    networks:
      - agentops_prod
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: agentops_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN}
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - agentops_prod
    restart: always

volumes:
  postgres_prod_data:
  redis_prod_data:
  qdrant_prod_data:
  prometheus_prod_data:
  grafana_prod_data:
  nginx_logs:

networks:
  agentops_prod:
    driver: bridge
